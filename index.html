<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donnas' 40th Budget</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --secondary: #2980b9;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--primary); }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; }

        .dashboard { 
            display: flex; flex-wrap: wrap; gap: 15px; background: #fff; padding: 15px; 
            border: 2px solid var(--accent); border-radius: 8px; margin-bottom: 25px;
            position: sticky; top: 5px; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .dash-item { flex: 1 1 100px; display: flex; flex-direction: column; }
        .dash-item label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; color: #7f8c8d; }
        .dash-input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; font-weight: bold; }

        /* The scrollable table container */
        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; min-width: 650px; } /* Force width for scroll */
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
        th { background: #fafafa; font-size: 0.75rem; text-transform: uppercase; color: #95a5a6; }
        
        input { padding: 8px; border: 1px solid #eee; border-radius: 4px; font-size: 16px; }
        .name-col { width: 140px; font-weight: bold; border: none; background: transparent; }
        .num-input { width: 60px; text-align: center; }
        
        .total-col { font-weight: bold; color: var(--accent); text-align: right; }
        
        .btn-add { width: 100%; padding: 15px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 20px; }
        .btn-del { color: var(--danger); background: none; border: 1px solid #f8d7da; border-radius: 4px; padding: 4px 8px; cursor: pointer; }

        .summary-banner { background: var(--primary); color: white; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Donnas' 40th Budget</h1>

    <div class="dashboard">
        <div class="dash-item"><label>Accom (£)</label><input type="number" id="accom-in" class="dash-input" value="4000" oninput="calc()"></div>
        <div class="dash-item"><label>Food (£)</label><input type="number" id="food-in" class="dash-input" value="350" oninput="calc()"></div>
        <div class="dash-item"><label>Activity (£)</label><input type="number" id="act-in" class="dash-input" value="0" oninput="calc()"></div>
        <div class="dash-item"><label>Total Rooms</label><div id="room-total" style="font-weight:bold; color:var(--accent); font-size:1.2rem; margin-top:5px">0</div></div>
    </div>

    <button class="btn-add" onclick="add()">+ Add Family Group</button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Family</th>
                    <th>People</th>
                    <th>Rooms</th>
                    <th>Food Units</th>
                    <th style="text-align: right;">Total Owed</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="summary-banner" id="bottom-summary">
        Average cost per person: £0.00
    </div>
</div>

<script>
    let families = [
        { name: "Rigby", count: 3, u1: 2.25, rooms: 2 },
        { name: "Smith", count: 6, u1: 3.5, rooms: 3 },
        { name: "Dickson", count: 4, u1: 3.0, rooms: 2 },
        { name: "Hall", count: 2, u1: 1.25, rooms: 1 },
        { name: "Rigby s", count: 2, u1: 2.0, rooms: 1 }
    ];

    function calc() {
        const aTotal = parseFloat(document.getElementById('accom-in').value) || 0;
        const fTotal = parseFloat(document.getElementById('food-in').value) || 0;
        const actTotal = parseFloat(document.getElementById('act-in').value) || 0;

        const tRooms = families.reduce((s, f) => s + f.rooms, 0);
        const tUnits = families.reduce((s, f) => s + f.u1, 0);
        const tPeople = families.reduce((s, f) => s + f.count, 0);
        const tGroups = families.length;

        document.getElementById('room-total').innerText = tRooms;

        const body = document.getElementById('table-body');
        body.innerHTML = '';

        families.forEach((f, i) => {
            const aS = tRooms > 0 ? (f.rooms / tRooms) * aTotal : 0;
            const fS = tUnits > 0 ? (f.u1 / tUnits) * fTotal : 0;
            const actS = tGroups > 0 ? actTotal / tGroups : 0;
            const total = aS + fS + actS;

            body.innerHTML += `
                <tr>
                    <td><input type="text" class="name-col" value="${f.name}" oninput="upd(${i},'name',this.value)"></td>
                    <td><input type="number" class="num-input" value="${f.count}" oninput="upd(${i},'count',parseFloat(this.value)||0)"></td>
                    <td><input type="number" class="num-input" value="${f.rooms}" oninput="upd(${i},'rooms',parseFloat(this.value)||0)"></td>
                    <td><input type="number" class="num-input" value="${f.u1}" step="0.25" oninput="upd(${i},'u1',parseFloat(this.value)||0)"></td>
                    <td class="total-col">£${total.toFixed(2)}</td>
                    <td><button class="btn-del" onclick="rem(${i})">✕</button></td>
                </tr>`;
        });

        const perPerson = tPeople > 0 ? (aTotal + fTotal + actTotal) / tPeople : 0;
        document.getElementById('bottom-summary').innerText = `Total Average per Person: £${perPerson.toFixed(2)}`;
    }

    function upd(i, fld, v) { families[i][fld] = v; calc(); }
    function add() { families.push({ name: "New Group", count: 2, u1: 1, rooms: 1 }); calc(); }
    function rem(i) { families.splice(i, 1); calc(); }

    calc();
</script>
</body>
</html>
