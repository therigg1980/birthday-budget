<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Donnas' 40th Budget</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --secondary: #2980b9;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--primary); }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        
        h1 { text-align: center; font-size: 1.3rem; margin: 10px 0 20px 0; }

        /* Dashboard: Stays on top, no scroll */
        .dashboard { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fff; padding: 12px; 
            border: 2px solid var(--accent); border-radius: 8px; margin-bottom: 20px;
            position: sticky; top: 5px; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .dash-item { display: flex; flex-direction: column; }
        .dash-item label { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; color: #7f8c8d; }
        .dash-input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; font-weight: bold; width: 100%; box-sizing: border-box; }

        /* Family Row: Built for vertical stacking */
        .family-row {
            padding: 15px 0; border-bottom: 1px solid #eee;
            display: flex; flex-direction: column; gap: 10px;
        }
        
        /* Top line: Name and Total always visible together */
        .row-header { display: flex; justify-content: space-between; align-items: center; }
        .name-input { font-weight: 800; border: none; font-size: 1.1rem; width: 60%; background: transparent; outline: none; color: var(--secondary); }
        .total-badge { text-align: right; }
        .total-label { display: block; font-size: 0.6rem; text-transform: uppercase; color: #999; font-weight: bold; }
        .total-amt { color: var(--accent); font-weight: 800; font-size: 1.2rem; }

        /* Bottom line: Inputs grouped together */
        .row-inputs { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .input-group { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .input-group span { font-size: 0.6rem; text-transform: uppercase; color: #bbb; margin-bottom: 4px; font-weight: bold; }
        .val-input { width: 100%; max-width: 60px; padding: 8px; text-align: center; border: 1px solid #eee; border-radius: 6px; font-size: 16px; background: #fafafa; }
        
        .btn-del { color: var(--danger); background: #fff5f5; border: 1px solid #ffebeb; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; margin-left: 10px; }
        .btn-add { width: 100%; padding: 16px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; margin-top: 15px; cursor: pointer; }

        /* Final Summary Box */
        .invoice-summary { background: var(--primary); color: white; padding: 15px; border-radius: 10px; margin-top: 30px; }
        .inv-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .inv-line:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Donnas' 40th Budget</h1>

    <div class="dashboard">
        <div class="dash-item"><label>Accom (£)</label><input type="number" id="accom-in" class="dash-input" value="4000" oninput="calc()"></div>
        <div class="dash-item"><label>Food (£)</label><input type="number" id="food-in" class="dash-input" value="350" oninput="calc()"></div>
        <div class="dash-item"><label>Activities (£)</label><input type="number" id="act-in" class="dash-input" value="0" oninput="calc()"></div>
        <div class="dash-item"><label>Total Rooms</label><div id="room-total" style="font-weight:800; color:var(--accent); font-size:1.2rem; margin-top:4px">0</div></div>
    </div>

    <div id="list"></div>
    <button class="btn-add" onclick="add()">+ Add Family Group</button>

    <div class="invoice-summary">
        <h3 style="margin-top:0; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px;">Quick Summary</h3>
        <div id="invoices"></div>
    </div>
</div>

<script>
    let families = [
        { name: "Rigby", count: 3, u1: 2.25, rooms: 2 },
        { name: "Smith", count: 6, u1: 3.5, rooms: 3 },
        { name: "Dickson", count: 4, u1: 3.0, rooms: 2 },
        { name: "Hall", count: 2, u1: 1.25, rooms: 1 },
        { name: "Rigby s", count: 2, u1: 2.0, rooms: 1 }
    ];

    function calc() {
        const aTotal = parseFloat(document.getElementById('accom-in').value) || 0;
        const fTotal = parseFloat(document.getElementById('food-in').value) || 0;
        const actTotal = parseFloat(document.getElementById('act-in').value) || 0;

        const tRooms = families.reduce((s, f) => s + f.rooms, 0);
        const tUnits = families.reduce((s, f) => s + f.u1, 0);
        const tGroups = families.length;

        document.getElementById('room-total').innerText = tRooms;

        const list = document.getElementById('list');
        const inv = document.getElementById('invoices');
        list.innerHTML = '';
        inv.innerHTML = '';

        families.forEach((f, i) => {
            const aS = tRooms > 0 ? (f.rooms / tRooms) * aTotal : 0;
            const fS = tUnits > 0 ? (f.u1 / tUnits) * fTotal : 0;
            const actS = tGroups > 0 ? actTotal / tGroups : 0;
            const total = aS + fS + actS;

            list.innerHTML += `
                <div class="family-row">
                    <div class="row-header">
                        <input type="text" class="name-input" value="${f.name}" oninput="upd(${i},'name',this.value)">
                        <div class="total-badge">
                            <span class="total-label">Owes Total</span>
                            <span class="total-amt">£${total.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="row-inputs">
                        <div class="input-group"><span>People</span><input type="number" class="val-input" value="${f.count}" oninput="upd(${i},'count',parseFloat(this.value)||0)"></div>
                        <div class="input-group"><span>Rooms</span><input type="number" class="val-input" value="${f.rooms}" oninput="upd(${i},'rooms',parseFloat(this.value)||0)"></div>
                        <div class="input-group"><span>Food Units</span><input type="number" class="val-input" value="${f.u1}" step="0.25" oninput="upd(${i},'u1',parseFloat(this.value)||0)"></div>
                        <button class="btn-del" onclick="rem(${i})">✕</button>
                    </div>
                </div>`;

            inv.innerHTML += `
                <div class="inv-line">
                    <span style="font-weight:bold">${f.name}</span>
                    <span style="color:#2ecc71; font-weight:800">£${total.toLocaleString(undefined,{minimumFractionDigits:2})}</span>
                </div>`;
        });
    }

    function upd(i, fld, v) { families[i][fld] = v; calc(); }
    function add() { families.push({ name: "New Group", count: 2, u1: 1.5, rooms: 1 }); calc(); }
    function remove(i) { families.splice(i, 1); calc(); }

    calc();
</script>
</body>
</html>
