<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Donnas' 40th Budget</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --secondary: #2980b9;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--primary); }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Dashboard Stays Compact */
        .dashboard { 
            display: flex; flex-wrap: wrap; gap: 10px; background: #fff; padding: 10px; 
            border: 2px solid var(--accent); border-radius: 8px; margin-bottom: 20px;
            position: sticky; top: 5px; z-index: 100;
        }
        .dash-item { flex: 1 1 120px; display: flex; flex-direction: column; }
        .dash-item label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; color: #7f8c8d; }
        .dash-input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; font-weight: bold; }

        /* The Table Fix */
        .row-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid #eee; flex-wrap: wrap;
        }
        .family-info { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .name-input { font-weight: bold; border: none; font-size: 1rem; width: 120px; background: transparent; }
        
        .inputs-area { display: flex; gap: 8px; flex: 1; align-items: center; }
        .input-box { display: flex; flex-direction: column; align-items: center; }
        .input-box span { font-size: 0.6rem; text-transform: uppercase; color: #999; margin-bottom: 2px; }
        .val-input { width: 50px; padding: 6px; text-align: center; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }

        .total-area { text-align: right; min-width: 90px; }
        .total-amt { color: var(--accent); font-weight: bold; font-size: 1.1rem; display: block; }
        
        .btn-del { color: var(--danger); background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0 10px; }
        .btn-add { width: 100%; padding: 12px; background: var(--secondary); color: white; border: none; border-radius: 6px; font-weight: bold; margin: 15px 0; }

        .invoice-box { background: var(--primary); color: white; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .inv-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div class="container">
    <h1>Donnas' 40th Budget</h1>

    <div class="dashboard">
        <div class="dash-item"><label>Accom (£)</label><input type="number" id="accom-in" class="dash-input" value="4000" oninput="calc()"></div>
        <div class="dash-item"><label>Food (£)</label><input type="number" id="food-in" class="dash-input" value="350" oninput="calc()"></div>
        <div class="dash-item"><label>Activity (£)</label><input type="number" id="act-in" class="dash-input" value="0" oninput="calc()"></div>
        <div class="dash-item"><label>Rooms</label><div id="room-total" style="font-weight:bold; color:var(--accent); margin-top:5px">0</div></div>
    </div>

    <div id="list"></div>
    <button class="btn-add" onclick="add()">+ Add Family Group</button>

    <div class="invoice-box">
        <h3 style="margin-top:0">Total Invoices</h3>
        <div id="invoices"></div>
    </div>
</div>

<script>
    let families = [
        { name: "Rigby", count: 3, u1: 2.25, rooms: 2 },
        { name: "Smith", count: 6, u1: 3.5, rooms: 3 },
        { name: "Dickson", count: 4, u1: 3.0, rooms: 2 },
        { name: "Hall", count: 2, u1: 1.25, rooms: 1 },
        { name: "Rigby s", count: 2, u1: 2.0, rooms: 1 }
    ];

    function calc() {
        const aTotal = parseFloat(document.getElementById('accom-in').value) || 0;
        const fTotal = parseFloat(document.getElementById('food-in').value) || 0;
        const actTotal = parseFloat(document.getElementById('act-in').value) || 0;

        const tRooms = families.reduce((s, f) => s + f.rooms, 0);
        const tUnits = families.reduce((s, f) => s + f.u1, 0);
        const tGroups = families.length;

        document.getElementById('room-total').innerText = tRooms;

        const list = document.getElementById('list');
        const inv = document.getElementById('invoices');
        list.innerHTML = '';
        inv.innerHTML = '';

        families.forEach((f, i) => {
            const aS = tRooms > 0 ? (f.rooms / tRooms) * aTotal : 0;
            const fS = tUnits > 0 ? (f.u1 / tUnits) * fTotal : 0;
            const actS = tGroups > 0 ? actTotal / tGroups : 0;
            const total = aS + fS + actS;

            list.innerHTML += `
                <div class="row-item">
                    <div class="family-info">
                        <input type="text" class="name-input" value="${f.name}" oninput="upd(${i},'name',this.value)">
                        <button class="btn-del" onclick="rem(${i})">✕</button>
                    </div>
                    <div class="inputs-area">
                        <div class="input-box"><span>Ppl</span><input type="number" class="val-input" value="${f.count}" oninput="upd(${i},'count',parseFloat(this.value)||0)"></div>
                        <div class="input-box"><span>Rooms</span><input type="number" class="val-input" value="${f.rooms}" oninput="upd(${i},'rooms',parseFloat(this.value)||0)"></div>
                        <div class="input-box"><span>Food</span><input type="number" class="val-input" value="${f.u1}" step="0.25" oninput="upd(${i},'u1',parseFloat(this.value)||0)"></div>
                    </div>
                    <div class="total-area">
                        <span style="font-size:0.6rem; color:#999; text-transform:uppercase">Owes</span>
                        <span class="total-amt">£${total.toFixed(2)}</span>
                    </div>
                </div>`;

            inv.innerHTML += `
                <div class="inv-row">
                    <span>${f.name}</span>
                    <span style="color:#2ecc71; font-weight:bold">£${total.toLocaleString(undefined,{minimumFractionDigits:2})}</span>
                </div>`;
        });
    }

    function upd(i, fld, v) { families[i][fld] = v; calc(); }
    function add() { families.push({ name: "New", count: 2, u1: 1, rooms: 1 }); calc(); }
    function rem(i) { families.splice(i, 1); calc(); }

    calc();
</script>
</body>
</html>
